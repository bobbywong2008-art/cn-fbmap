<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="中国青少年美式装备橄榄球球队分布图，覆盖全国16个城市38+支球队，提供城市筛选、年龄段筛选、球队搜索等功能。">
  <meta name="keywords" content="青少年橄榄球,美式足球,装备橄榄球,中国橄榄球地图,橄榄球球队">
  <title>中国青少年美式装备橄榄球地图图鉴</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>

<!-- 加载动画 -->
<div id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">加载中...</div>
</div>

<!-- 地图容器 -->
<div id="map"></div>
<div id="vignette"></div>

<!-- 标题栏 -->
<div id="title-bar">
  <span class="title-icon">🏈</span>
  <span>中国青少年美式装备橄榄球地图图鉴</span>
  <span class="title-badge">全国 40 支球队</span>
</div>

<!-- ===== 筛选面板 ===== -->
<div id="control-panel">
  <div class="panel-header" id="panelHeader">
    <span>🔍 球队筛选器</span>
    <button class="panel-toggle" id="panelToggle">⟨</button>
  </div>
  <div class="panel-content" id="panelContent">
    <!-- 搜索 -->
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="搜索球队或城市...">
      <span class="search-icon">🔎</span>
    </div>

    <!-- 区域筛选 -->
    <div class="filter-section">
      <div class="filter-title">区域筛选</div>
      <div class="region-filters">
        <button class="region-btn active" data-region="all">全部</button>
        <button class="region-btn" data-region="华南">华南</button>
        <button class="region-btn" data-region="华东">华东</button>
        <button class="region-btn" data-region="华北">华北</button>
        <button class="region-btn" data-region="华中">华中</button>
        <button class="region-btn" data-region="西南">西南</button>
        <button class="region-btn" data-region="西北">西北</button>
      </div>
    </div>

    <!-- 城市筛选 -->
    <div class="filter-section">
      <div class="filter-title">城市</div>
      <div id="city-filters" class="city-filters"></div>
    </div>

    <!-- 年龄段 -->
    <div class="filter-section">
      <div class="filter-title">年龄段</div>
      <div class="age-filters" id="ageFilters">
        <button class="age-btn active" data-age="all">全部</button>
        <button class="age-btn" data-age="U9">U9</button>
        <button class="age-btn" data-age="U10">U10</button>
        <button class="age-btn" data-age="U11">U11</button>
        <button class="age-btn" data-age="U13">U13</button>
        <button class="age-btn" data-age="U15">U15</button>
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="action-buttons">
      <button id="showAllBtn" class="action-btn primary">显示全部</button>
      <button id="resetBtn" class="action-btn">重置筛选</button>
    </div>
  </div>
</div>

<!-- ===== 图例 ===== -->
<div id="legend">
  <div class="legend-title">📊 数据总览</div>
  <div id="legend-content"></div>
</div>

<!-- 返回全国按钮 -->
<button id="backBtn" style="display:none;">← 返回全国</button>

<!-- ===== 留言板按钮 ===== -->
<button id="guestbookBtn" title="留言板" aria-label="留言板">💬</button>

<!-- ===== 留言板面板 ===== -->
<div id="guestbook" class="guestbook-overlay" aria-hidden="true">
  <div class="guestbook-panel">
    <div class="guestbook-header">
      <span class="guestbook-title">💬 留言板</span>
      <button id="guestbookClose" class="guestbook-close" aria-label="关闭">×</button>
    </div>
    <div class="guestbook-body">
      <div id="guestbook-list" class="guestbook-list"></div>
      <div class="guestbook-form">
        <input type="text" id="guestbookName" placeholder="你的昵称（选填）" maxlength="12" autocomplete="off">
        <textarea id="guestbookText" placeholder="写下你的留言…" maxlength="200" rows="3"></textarea>
        <button id="guestbookSubmit" class="guestbook-submit">发表留言</button>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js?v=11"></script>
</body>
</html>
